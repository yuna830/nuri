spring.config.import=optional:file:.env.local[.properties]

spring.datasource.url=jdbc:postgresql://168.107.27.186:5432/woori
spring.datasource.username=woori
spring.datasource.password=${OCI_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=${RECALL_MIGRATION_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

server.port=8090

springdoc.swagger-ui.path=/swagger-ui.html

# SafetyKorea ?? API
public-data.recall-api-key=${RECALL_API_KEY:}
public-data.recall-list-url=${RECALL_LIST_URL:http://www.safetykorea.kr/openapi/api/recall/recallList.json}
public-data.recall-detail-url=${RECALL_DETAIL_URL:http://www.safetykorea.kr/openapi/api/recall/recallDetail.json}
public-data.recall-connect-timeout-ms=${RECALL_CONNECT_TIMEOUT_MS:5000}
public-data.recall-read-timeout-ms=${RECALL_READ_TIMEOUT_MS:8000}

# ? ?? ?? ??
recall.new-decision-engine-enabled=true
recall.scheduler-enabled=${RECALL_SCHEDULER_ENABLED:false}
recall.notification-enabled=${RECALL_NOTIFICATION_ENABLED:false}
recall.dry-run=${RECALL_DRY_RUN:true}
recall.scheduler-cron=${RECALL_SCHEDULER_CRON:0 0 3 * * *}
recall.scheduler-zone=${RECALL_SCHEDULER_ZONE:Asia/Seoul}

# ?? ?? API
public-data.weather-api-key=${WEATHER_API_KEY:${VITE_PUBLIC_DATA_SERVICE_KEY:}}
public-data.energy-efficiency-api-key=${ENERGY_EFFICIENCY_API_KEY:${VITE_PUBLIC_DATA_SERVICE_KEY:}}
public-data.welfare-facility-api-key=${WELFARE_FACILITY_API_KEY:${VITE_PUBLIC_DATA_SERVICE_KEY:}}
public-data.kakao-rest-api-key=${KAKAO_REST_API_KEY:${VITE_KAKAO_REST_API_KEY:}}

jwt.secret=${JWT_SECRET:woorilink-secret-key-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration-ms=604800000