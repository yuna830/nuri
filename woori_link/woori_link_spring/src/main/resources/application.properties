spring.datasource.url=jdbc:postgresql://168.107.27.186:5432/woori
spring.datasource.username=woori
spring.datasource.password=${OCI_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

server.port=8090

springdoc.swagger-ui.path=/swagger-ui.html

public-data.recall-api-key=${RECALL_API_KEY:}
public-data.weather-api-key=${WEATHER_API_KEY:}
public-data.energy-efficiency-api-key=${ENERGY_EFFICIENCY_API_KEY:}
